  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   networks:
  #     - ticket-network

  # 前端服务(可选,开发时可以本地运行)
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile.dev
  #   container_name: ticket-frontend
  #   ports:
  #     - "5173:5173"
  #   environment:
  #     VITE_API_BASE_URL: http://localhost:3000/api
  #   volumes:
  #     - ./frontend:/app
  #     - /app/node_modules
  #   networks:
