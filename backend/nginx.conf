# Nginx反向代理配置
# 工单系统后端API服务

# 上游服务器配置
upstream ticket_backend {
    # 后端服务地址
    server localhost:3000;

    # 可以配置多个实例实现负载均衡
    # server localhost:3001;
    # server localhost:3002;

    # 负载均衡策略
    # least_conn;  # 最少连接
    # ip_hash;     # IP哈希

    # 健康检查
    keepalive 32;
}

# HTTP服务器（重定向到HTTPS）
server {
    listen 80;
    listen [::]:80;
    server_name api.yourdomain.com;

    # Let's Encrypt验证
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 重定向所有HTTP请求到HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS服务器
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.yourdomain.com;

    # SSL证书配置
    ssl_certificate /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;

    # SSL优化配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS（HTTP Strict Transport Security）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 其他安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # 客户端请求体大小限制（文件上传）
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # 超时配置
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # 日志配置
    access_log /var/log/nginx/ticket-api-access.log;
    error_log /var/log/nginx/ticket-api-error.log warn;

    # 健康检查端点（不记录日志）
    location = /health {
        proxy_pass http://ticket_backend;
        access_log off;
        proxy_set_header Host $host;
    }

    # API路由
    location / {
        # 代理到后端服务
        proxy_pass http://ticket_backend;

        # HTTP版本
        proxy_http_version 1.1;

        # WebSocket支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # 传递原始请求信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # 禁用缓存（API响应）
        proxy_cache_bypass $http_upgrade;

        # 缓冲配置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # 静态文件（如果需要通过Nginx直接提供）
    location /uploads/ {
        alias /home/caohui/projects/工单项目/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";

        # 安全配置
        # 防止执行脚本
        location ~* \.(php|jsp|asp|aspx|cgi)$ {
            deny all;
        }
    }

    # Swagger文档（可选，生产环境建议移除或限制访问）
    location /api/docs {
        # IP白名单
        # allow 192.168.1.0/24;
        # deny all;

        proxy_pass http://ticket_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# WebSocket专用配置（如果需要独立的WebSocket端点）
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ws.yourdomain.com;

    ssl_certificate /etc/letsencrypt/live/ws.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ws.yourdomain.com/privkey.pem;

    location / {
        proxy_pass http://ticket_backend;
        proxy_http_version 1.1;

        # WebSocket必需配置
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # WebSocket超时配置
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}
